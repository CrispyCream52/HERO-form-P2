<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-CREDITS</title>
    <link rel="stylesheet" href="../css/redacted.css">
    <link rel="icon" type="image/x-icon" href="../images/nothing.png">
</head>
<body>
    <audio src="../sounds/snd_menumove.wav" id="hover-snd"></audio>
    <audio src="../sounds/snd_select.wav" id="click-snd"></audio>
    <div class="centered">
        <a id="btn" class="obtain_btn fade-credits enabled-snd" href="index.html">Return</a>
        <img src="../images/dess_walking.gif" id="lostgirl-ab" class="fade-credits absolute">
        <video id="credits">
            <source src="../videos/credits-en.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        document.addEventListener('click', function() {
            const credits = document.getElementById("credits");
            const her = document.querySelector("#lostgirl-ab");
            const return_btn = document.getElementById("btn");

            setTimeout(() => {
                credits.play();
            }, 1000);

            setTimeout(() => {
                her.classList.add('fadein');
                her.classList.add('walk-in');
            }, 122000);

            setTimeout(() => {
                her.src = '../images/lostgirl.png';
            }, 132000);

            setTimeout(() => {
                her.remove();
            }, 137310);

            setTimeout(() => {
                return_btn.classList.add('fadein');
                return_btn.style.zIndex = '1';
            }, 140000);
        }, { once: true });
    </script>
    <script src="../scripts/script.js"></script>
</body>
</html>
